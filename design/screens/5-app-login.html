<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>App — Masuk</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;}
a{text-decoration:none;}
</style>
</head>
<body style="margin:0;">
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #FFFFFF;">

  <div style="height: 306px; box-sizing: border-box; background: #46603C; padding: 30px 28px 0; display: flex; flex-direction: column; justify-content: space-between; position: relative; flex-shrink: 0; overflow: hidden;">
    <svg viewBox="0 0 200 220" width="190" height="210" style="position: absolute; right: -30px; bottom: -24px; opacity: 0.14;">
      <path d="M100 8 C46 26 14 84 14 146 C14 188 52 214 100 214 C148 214 186 188 186 146 C186 84 154 26 100 8 Z" fill="#EEEADC"/>
    </svg>
    <div style="display: flex; align-items: center; gap: 9px; position: relative;">
      <div style="width: 30px; height: 30px; border-radius: 50%; background: #EEEADC; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#20261B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19C5 9 12 5 20 4c1 8-3 15-13 15-1 0-2 0-2 0z"/><path d="M6 18C10 14 14 10 19 5.5"/></svg>
      </div>
      <span style="font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 17px; color: #F5F2E6;">AgriVision</span>
    </div>
    <h1 style="margin: 0 0 34px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 27px; line-height: 1.2; color: #F5F2E6; white-space: pre-line; position: relative;">Diagnosis dini,
panen lebih baik.</h1>
  </div>

  <div style="flex-grow: 1; background: #FFFFFF; border-radius: 22px 22px 0 0; margin-top: -20px; padding: 30px 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; position: relative;">
    <div>
      <h2 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px; color: #20261B;">Masuk ke akun Anda</h2>
      <p style="margin: 5px 0 0; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #8B9280;">Pantau kesehatan tanaman dari genggaman tangan.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 13px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="a-email" style="font-family: 'IBM Plex Sans', sans-serif; font-size: 12.5px; font-weight: 500; color: #20261B;">Email</label>
        <input id="a-email" type="email" placeholder="nama@email.com" style="padding: 13px 14px; border: 1px solid #D7D2C2; border-radius: 9px; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: #20261B; background: #FBFAF5; box-sizing: border-box;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="a-password" style="font-family: 'IBM Plex Sans', sans-serif; font-size: 12.5px; font-weight: 500; color: #20261B;">Kata sandi</label>
        <input id="a-password" type="password" placeholder="••••••••" style="padding: 13px 14px; border: 1px solid #D7D2C2; border-radius: 9px; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: #20261B; background: #FBFAF5; box-sizing: border-box;">
      </div>
      <a href="#" style="align-self: flex-end; font-family: 'IBM Plex Sans', sans-serif; font-size: 12.5px; color: #46603C; font-weight: 500;">Lupa kata sandi?</a>
      <button type="button" style="padding: 15px; border: none; border-radius: 9px; background: #46603C; color: #FFFFFF; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 15px; cursor: pointer;">Masuk</button>
    </div>

    <p style="text-align: center; font-family: 'IBM Plex Sans', sans-serif; font-size: 12.5px; color: #8B9280; margin: 6px 0 0;">Belum punya akun?<br><a href="#" style="color: #46603C; font-weight: 600;">Hubungi admin di wilayah Anda</a></p>
  </div>
</div>
</body>
</html>
